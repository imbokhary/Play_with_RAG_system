name: check-independence

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  check-independence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify no cross-version runtime imports
        run: |
          python - <<'EOF'
          from pathlib import Path
          import re

          root = Path(".")
          version_dirs = [p for p in root.iterdir() if p.is_dir() and p.name.startswith("v")]
          pattern = re.compile(r"^\s*(?:import|from)\s+(\.\.|shared-resources)")

          for vdir in version_dirs:
              for py in vdir.rglob("*.py"):
                  text = py.read_text(encoding="utf-8")
                  for line in text.splitlines():
                      m = pattern.match(line)
                      if m:
                          print(f"FAIL: {py} imports from {m.group(1)}")
                          raise SystemExit(1)
          print("PASS: no version imports from another version or shared-resources at runtime")
          EOF

      - name: Verify no generated artifacts committed
        run: |
          if git ls-files --error-unmatch .venv venv __pycache__ >/dev/null 2>&1; then
            echo "FAIL: generated artifacts tracked in git"; exit 1
          fi
          echo "PASS: no generated artifacts tracked"