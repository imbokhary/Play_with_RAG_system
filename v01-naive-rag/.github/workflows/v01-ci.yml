name: V01 CI

on:
  push:
    branches: [develop, main]
    paths: ["v01-naive-rag/**"]
  pull_request:
    branches: [develop, main]
    paths: ["v01-naive-rag/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check v01-naive-rag

      - name: Run unit tests (no Ollama required)
        run: python -m unittest discover -s v01-naive-rag/tests -v

      - name: Verify CLI contract shape
        run: |
          python - <<'EOF'
          import json, subprocess, sys
          # ingest must produce a JSON object with chunks count
          out = subprocess.check_output([sys.executable, "v01-naive-rag/rag.py", "ingest", "--json"])
          data = json.loads(out)
          assert data["schema_version"] == "1"
          assert "chunks" in data
          print("PASS: ingest contract ok")
          EOF